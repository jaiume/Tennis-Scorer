<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tennis Scorekeeper</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#101512;color:#fff}
  .wrap{max-width:760px;margin:auto;padding:18px}
  h1{text-align:center}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:#1b241e;border:1px solid #3b4f40;border-radius:16px;padding:14px}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #4d6553;background:#111713;color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin:10px 0}
  .label{font-size:14px;color:#c2cec4}
  .score{font-size:34px;font-weight:900}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:132px}
  button{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;touch-action:manipulation}
  .btns button{padding:15px 0;min-width:0}
  .p1{background:#b8ff3d;color:#132000}
  .p2{background:#69c6ff;color:#061a24}
  .bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:15px}
  .bottom button{background:#2a372e;color:#fff;border:1px solid #48604f}
  #shareBtn{background:#b8ff3d;color:#132000;border:0}
  #jsWarning{background:#6b2d2d;padding:12px;border-radius:10px;text-align:center;margin-bottom:12px}
  @media(max-width:560px){.players{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎾 Tennis Score</h1>
  <div id="jsWarning">JavaScript has not started. Open this file in Safari or Chrome.</div>

  <div class="players">
    <div class="card">
      <input id="n0" value="Player 1">
      <div class="row">
        <div><div class="label">In-game score</div><div class="score" id="p0">0</div></div>
        <div class="btns">
          <button type="button" class="p1 pointBtn" data-player="0" data-delta="-1">−</button>
          <button type="button" class="p1 pointBtn" data-player="0" data-delta="1">+</button>
        </div>
      </div>
      <div class="row">
        <div><div class="label">Games</div><div class="score" id="g0">0</div></div>
        <div class="btns">
          <button type="button" class="p1 gameBtn" data-player="0" data-delta="-1">−</button>
          <button type="button" class="p1 gameBtn" data-player="0" data-delta="1">+</button>
        </div>
      </div>
      <div class="row">
        <div><div class="label">Sets</div><div class="score" id="s0">0</div></div>
        <div class="btns">
          <button type="button" class="p1 setBtn" data-player="0" data-delta="-1">−</button>
          <button type="button" class="p1 setBtn" data-player="0" data-delta="1">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <input id="n1" value="Player 2">
      <div class="row">
        <div><div class="label">In-game score</div><div class="score" id="p1">0</div></div>
        <div class="btns">
          <button type="button" class="p2 pointBtn" data-player="1" data-delta="-1">−</button>
          <button type="button" class="p2 pointBtn" data-player="1" data-delta="1">+</button>
        </div>
      </div>
      <div class="row">
        <div><div class="label">Games</div><div class="score" id="g1">0</div></div>
        <div class="btns">
          <button type="button" class="p2 gameBtn" data-player="1" data-delta="-1">−</button>
          <button type="button" class="p2 gameBtn" data-player="1" data-delta="1">+</button>
        </div>
      </div>
      <div class="row">
        <div><div class="label">Sets</div><div class="score" id="s1">0</div></div>
        <div class="btns">
          <button type="button" class="p2 setBtn" data-player="1" data-delta="-1">−</button>
          <button type="button" class="p2 setBtn" data-player="1" data-delta="1">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button type="button" id="undoBtn">↩ Undo</button>
    <button type="button" id="shareBtn">Share</button>
    <button type="button" id="resetBtn">Reset</button>
  </div>
</div>

<script>
(function(){
  const pointLabels = ["0","15","30","40","AD"];
  let state = {points:[0,0],games:[0,0],sets:[0,0]};
  let history = [];

  document.getElementById("jsWarning").style.display = "none";

  function save(){
    history.push(JSON.stringify(state));
    if(history.length > 100) history.shift();
  }

  function render(){
    for(let i=0;i<2;i++){
      document.getElementById("p"+i).textContent = pointLabels[state.points[i]];
      document.getElementById("g"+i).textContent = state.games[i];
      document.getElementById("s"+i).textContent = state.sets[i];
    }
  }

  function wrap(value, max){
    return ((value % max) + max) % max;
  }

  document.querySelectorAll(".pointBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      save();
      state.points[i] = wrap(state.points[i] + delta, pointLabels.length);
      render();
    });
  });

  document.querySelectorAll(".gameBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      if(delta < 0 && state.games[i] <= 0) return;
      save();
      state.games[i] = Math.max(0, state.games[i] + delta);
      render();
    });
  });

  document.querySelectorAll(".setBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      if(delta < 0 && state.sets[i] <= 0) return;
      save();
      state.sets[i] = Math.max(0, state.sets[i] + delta);
      render();
    });
  });

  document.getElementById("undoBtn").addEventListener("click", function(){
    if(!history.length) return;
    state = JSON.parse(history.pop());
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    save();
    state = {points:[0,0],games:[0,0],sets:[0,0]};
    render();
  });

  function playerName(i){
    const el = document.getElementById("n"+i);
    return (el && el.value.trim()) || ("Player " + (i + 1));
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildScoreBlob(){
    const W = 1080, H = 720, dpr = 2;
    const canvas = document.createElement("canvas");
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "#101512";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 48px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Tennis Score", W / 2, 78);

    const names = [playerName(0), playerName(1)];
    const accents = ["#b8ff3d", "#69c6ff"];
    const cardW = 460, cardH = 480, gap = 40;
    const startX = (W - (cardW * 2 + gap)) / 2;
    const startY = 120;

    for(let i = 0; i < 2; i++){
      const x = startX + i * (cardW + gap);
      const y = startY;

      ctx.fillStyle = "#1b241e";
      roundRect(ctx, x, y, cardW, cardH, 28);
      ctx.fill();
      ctx.strokeStyle = "#3b4f40";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = accents[i];
      roundRect(ctx, x + 28, y + 28, cardW - 56, 70, 16);
      ctx.fill();
      ctx.fillStyle = i === 0 ? "#132000" : "#061a24";
      ctx.font = "800 34px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "center";
      const name = names[i].length > 18 ? names[i].slice(0, 17) + "…" : names[i];
      ctx.fillText(name, x + cardW / 2, y + 74);

      const rows = [
        ["Points", pointLabels[state.points[i]]],
        ["Games", String(state.games[i])],
        ["Sets", String(state.sets[i])]
      ];
      rows.forEach(function(row, ri){
        const ry = y + 150 + ri * 100;
        ctx.fillStyle = "#c2cec4";
        ctx.font = "600 28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(row[0], x + 40, ry);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 64px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(row[1], x + cardW - 40, ry + 10);
      });
    }

    return new Promise(function(resolve){
      canvas.toBlob(function(blob){ resolve(blob); }, "image/png");
    });
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("shareBtn").addEventListener("click", async function(){
    const btn = this;
    btn.disabled = true;
    try{
      const blob = await buildScoreBlob();
      if(!blob) throw new Error("Could not create image");
      const file = new File([blob], "tennis-score.png", { type: "image/png" });
      const summary = playerName(0) + " " + pointLabels[state.points[0]] + "/" + state.games[0] + "/" + state.sets[0]
        + " vs " + playerName(1) + " " + pointLabels[state.points[1]] + "/" + state.games[1] + "/" + state.sets[1];
      const shareData = { files: [file], title: "Tennis Score", text: summary };

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share(shareData);
      } else {
        downloadBlob(blob, "tennis-score.png");
      }
    } catch(err){
      if(err && err.name === "AbortError") return;
      alert("Sharing failed. Try again or take a screenshot.");
    } finally {
      btn.disabled = false;
    }
  });

  render();
})();
</script>
</body>
</html>
