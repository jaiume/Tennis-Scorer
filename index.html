<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tennis Scorekeeper</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#101512;color:#fff;
    overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{
    max-width:760px;margin:auto;
    height:100svh;max-height:100svh;
    padding:6px 8px 8px;
    display:flex;flex-direction:column;gap:6px;
  }
  h1{text-align:center;margin:0;font-size:20px;line-height:1.1;flex:0 0 auto}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 auto;min-height:0}
  .card{
    background:#1b241e;border:1px solid #3b4f40;border-radius:12px;padding:6px;
    display:flex;flex-direction:column;min-height:0;
  }
  input{
    width:100%;padding:7px;border-radius:8px;border:1px solid #4d6553;
    background:#111713;color:#fff;font-size:14px;font-weight:700;text-align:center;
    margin:0 0 4px;flex:0 0 auto;
  }
  .rows{display:flex;flex-direction:column;gap:4px;flex:1 1 auto;min-height:0}
  .row{
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px;
    flex:1 1 auto;min-height:0;
  }
  .label{font-size:10px;color:#c2cec4;line-height:1.1}
  .score{font-size:clamp(18px,4.8vh,30px);font-weight:900;line-height:1}
  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;width:108px}
  button{border:0;border-radius:8px;padding:10px;font-size:14px;font-weight:800;touch-action:manipulation}
  .btns button{
    padding:0;min-width:0;min-height:38px;height:100%;
    font-size:18px;line-height:1;
  }
  .p1{background:#b8ff3d;color:#132000}
  .p2{background:#69c6ff;color:#061a24}
  .setsBox{
    flex:0 0 auto;
    background:#1b241e;border:1px solid #3b4f40;border-radius:10px;
    padding:6px 8px;max-height:22svh;display:flex;flex-direction:column;min-height:0;
  }
  .setsTitle{font-size:11px;color:#c2cec4;margin:0 0 4px;flex:0 0 auto}
  .setsList{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1 1 auto}
  .setRow{
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
    padding:5px 0;border-top:1px solid #2a372e;font-size:13px;font-weight:700;
  }
  .setRow:first-child{border-top:0}
  .setRow button{
    background:#2a372e;color:#fff;border:1px solid #48604f;
    padding:4px 8px;font-size:12px;border-radius:8px;
  }
  .setsEmpty{color:#7f8f84;font-size:12px;padding:2px 0}
  .bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:0 0 auto}
  .bottom button{background:#2a372e;color:#fff;border:1px solid #48604f;padding:10px 8px;font-size:13px}
  #shareBtn{background:#b8ff3d;color:#132000;border:0}
  #jsWarning{display:none;background:#6b2d2d;padding:8px;border-radius:8px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎾 Tennis Score</h1>
  <div id="jsWarning">JavaScript has not started. Open this file in Safari or Chrome.</div>

  <div class="players">
    <div class="card">
      <input id="n0" value="Player 1">
      <div class="rows">
        <div class="row">
          <div><div class="label">Score</div><div class="score" id="p0">0</div></div>
          <div class="btns">
            <button type="button" class="p1 pointBtn" data-player="0" data-delta="-1">−</button>
            <button type="button" class="p1 pointBtn" data-player="0" data-delta="0">0</button>
            <button type="button" class="p1 pointBtn" data-player="0" data-delta="1">+</button>
          </div>
        </div>
        <div class="row">
          <div><div class="label">Games</div><div class="score" id="g0">0</div></div>
          <div class="btns">
            <button type="button" class="p1 gameBtn" data-player="0" data-delta="-1">−</button>
            <button type="button" class="p1 gameBtn" data-player="0" data-delta="0">0</button>
            <button type="button" class="p1 gameBtn" data-player="0" data-delta="1">+</button>
          </div>
        </div>
        <div class="row">
          <div><div class="label">Sets</div><div class="score" id="s0">0</div></div>
          <div class="btns">
            <button type="button" class="p1 setBtn" data-player="0" data-delta="-1">−</button>
            <button type="button" class="p1 setBtn" data-player="0" data-delta="0">0</button>
            <button type="button" class="p1 setBtn" data-player="0" data-delta="1">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <input id="n1" value="Player 2">
      <div class="rows">
        <div class="row">
          <div><div class="label">Score</div><div class="score" id="p1">0</div></div>
          <div class="btns">
            <button type="button" class="p2 pointBtn" data-player="1" data-delta="-1">−</button>
            <button type="button" class="p2 pointBtn" data-player="1" data-delta="0">0</button>
            <button type="button" class="p2 pointBtn" data-player="1" data-delta="1">+</button>
          </div>
        </div>
        <div class="row">
          <div><div class="label">Games</div><div class="score" id="g1">0</div></div>
          <div class="btns">
            <button type="button" class="p2 gameBtn" data-player="1" data-delta="-1">−</button>
            <button type="button" class="p2 gameBtn" data-player="1" data-delta="0">0</button>
            <button type="button" class="p2 gameBtn" data-player="1" data-delta="1">+</button>
          </div>
        </div>
        <div class="row">
          <div><div class="label">Sets</div><div class="score" id="s1">0</div></div>
          <div class="btns">
            <button type="button" class="p2 setBtn" data-player="1" data-delta="-1">−</button>
            <button type="button" class="p2 setBtn" data-player="1" data-delta="0">0</button>
            <button type="button" class="p2 setBtn" data-player="1" data-delta="1">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="setsBox">
    <div class="setsTitle">Set results</div>
    <div class="setsList" id="setsList"></div>
  </div>

  <div class="bottom">
    <button type="button" id="undoBtn">↩ Undo</button>
    <button type="button" id="shareBtn">Share</button>
    <button type="button" id="resetBtn">Reset</button>
  </div>
</div>

<script>
(function(){
  const pointLabels = ["0","15","30","40","AD"];
  let state = {points:[0,0],games:[0,0],sets:[0,0],setLog:[]};
  let history = [];

  document.getElementById("jsWarning").style.display = "none";

  function snapshot(){
    return JSON.stringify(state);
  }

  function save(){
    history.push(snapshot());
    if(history.length > 100) history.shift();
  }

  function playerName(i){
    const el = document.getElementById("n"+i);
    return (el && el.value.trim()) || ("Player " + (i + 1));
  }

  function renderSetLog(){
    const list = document.getElementById("setsList");
    list.innerHTML = "";
    if(!state.setLog.length){
      const empty = document.createElement("div");
      empty.className = "setsEmpty";
      empty.textContent = "No sets recorded yet";
      list.appendChild(empty);
      return;
    }
    state.setLog.forEach(function(entry, index){
      const row = document.createElement("div");
      row.className = "setRow";
      const text = document.createElement("div");
      text.textContent = entry.winnerName + " " + entry.winnerGames + " - " + entry.loserGames;
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "Delete";
      del.addEventListener("click", function(){
        save();
        const removed = state.setLog.splice(index, 1)[0];
        if(removed){
          state.sets[removed.winner] = Math.max(0, state.sets[removed.winner] - 1);
        }
        render();
      });
      row.appendChild(text);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function render(){
    for(let i=0;i<2;i++){
      document.getElementById("p"+i).textContent = pointLabels[state.points[i]];
      document.getElementById("g"+i).textContent = state.games[i];
      document.getElementById("s"+i).textContent = state.sets[i];
    }
    renderSetLog();
  }

  function wrap(value, max){
    return ((value % max) + max) % max;
  }

  document.querySelectorAll(".pointBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      save();
      if(delta === 0) state.points[i] = 0;
      else state.points[i] = wrap(state.points[i] + delta, pointLabels.length);
      render();
    });
  });

  document.querySelectorAll(".gameBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      if(delta < 0 && state.games[i] <= 0) return;
      if(delta === 0 && state.games[i] === 0) return;
      save();
      if(delta === 0) state.games[i] = 0;
      else state.games[i] = Math.max(0, state.games[i] + delta);
      render();
    });
  });

  document.querySelectorAll(".setBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
      const i = Number(this.dataset.player);
      const delta = Number(this.dataset.delta);
      const other = 1 - i;

      if(delta < 0 && state.sets[i] <= 0) return;
      if(delta === 0 && state.sets[i] === 0) return;

      save();

      if(delta === 1){
        state.setLog.push({
          winner: i,
          winnerName: playerName(i),
          winnerGames: state.games[i],
          loserGames: state.games[other]
        });
        state.sets[i]++;
        state.games = [0, 0];
        state.points = [0, 0];
      } else if(delta === 0){
        state.sets[i] = 0;
        state.setLog = state.setLog.filter(function(entry){ return entry.winner !== i; });
      } else {
        state.sets[i] = Math.max(0, state.sets[i] - 1);
        for(let j = state.setLog.length - 1; j >= 0; j--){
          if(state.setLog[j].winner === i){
            state.setLog.splice(j, 1);
            break;
          }
        }
      }
      render();
    });
  });

  document.getElementById("undoBtn").addEventListener("click", function(){
    if(!history.length) return;
    state = JSON.parse(history.pop());
    if(!state.setLog) state.setLog = [];
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    save();
    state = {points:[0,0],games:[0,0],sets:[0,0],setLog:[]};
    render();
  });

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function buildScoreBlob(){
    const logLines = state.setLog.map(function(entry){
      return entry.winnerName + " " + entry.winnerGames + " - " + entry.loserGames;
    });
    const extra = Math.max(0, logLines.length - 3) * 36;
    const W = 1080, H = 720 + extra, dpr = 2;
    const canvas = document.createElement("canvas");
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "#101512";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 48px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Tennis Score", W / 2, 78);

    const names = [playerName(0), playerName(1)];
    const accents = ["#b8ff3d", "#69c6ff"];
    const cardW = 460, cardH = 420, gap = 40;
    const startX = (W - (cardW * 2 + gap)) / 2;
    const startY = 120;

    for(let i = 0; i < 2; i++){
      const x = startX + i * (cardW + gap);
      const y = startY;

      ctx.fillStyle = "#1b241e";
      roundRect(ctx, x, y, cardW, cardH, 28);
      ctx.fill();
      ctx.strokeStyle = "#3b4f40";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = accents[i];
      roundRect(ctx, x + 28, y + 28, cardW - 56, 70, 16);
      ctx.fill();
      ctx.fillStyle = i === 0 ? "#132000" : "#061a24";
      ctx.font = "800 34px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "center";
      const name = names[i].length > 18 ? names[i].slice(0, 17) + "…" : names[i];
      ctx.fillText(name, x + cardW / 2, y + 74);

      const rows = [
        ["Points", pointLabels[state.points[i]]],
        ["Games", String(state.games[i])],
        ["Sets", String(state.sets[i])]
      ];
      rows.forEach(function(row, ri){
        const ry = y + 150 + ri * 85;
        ctx.fillStyle = "#c2cec4";
        ctx.font = "600 28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(row[0], x + 40, ry);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 56px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(row[1], x + cardW - 40, ry + 8);
      });
    }

    if(logLines.length){
      let y = startY + cardH + 50;
      ctx.fillStyle = "#c2cec4";
      ctx.font = "700 28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Set results", startX, y);
      y += 40;
      ctx.fillStyle = "#ffffff";
      ctx.font = "600 28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      logLines.forEach(function(line){
        ctx.fillText(line, startX, y);
        y += 36;
      });
    }

    return new Promise(function(resolve){
      canvas.toBlob(function(blob){ resolve(blob); }, "image/png");
    });
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("shareBtn").addEventListener("click", async function(){
    const btn = this;
    btn.disabled = true;
    try{
      const blob = await buildScoreBlob();
      if(!blob) throw new Error("Could not create image");
      const file = new File([blob], "tennis-score.png", { type: "image/png" });
      const summary = playerName(0) + " " + pointLabels[state.points[0]] + "/" + state.games[0] + "/" + state.sets[0]
        + " vs " + playerName(1) + " " + pointLabels[state.points[1]] + "/" + state.games[1] + "/" + state.sets[1];
      const shareData = { files: [file], title: "Tennis Score", text: summary };

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share(shareData);
      } else {
        downloadBlob(blob, "tennis-score.png");
      }
    } catch(err){
      if(err && err.name === "AbortError") return;
      alert("Sharing failed. Try again or take a screenshot.");
    } finally {
      btn.disabled = false;
    }
  });

  render();
})();
</script>
</body>
</html>
